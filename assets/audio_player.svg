<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120" fill="none">
  <style>
    .bg { fill: #09090b; stroke: #27272a; stroke-width: 1px; rx: 8px; }
    .title { font-family: 'Fira Code', 'Courier New', monospace; font-weight: 700; font-size: 14px; fill: #ffffff; }
    .artist { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #00f0ff; }
    .album { font-family: 'Fira Code', 'Courier New', monospace; font-size: 10px; fill: #71717a; }
    .time { font-family: 'Fira Code', 'Courier New', monospace; font-size: 10px; fill: #a855f7; }
    .bar-bg { fill: #18181b; rx: 2px; }
    .bar-fill { fill: #00f0ff; rx: 2px; }
    
    .eq-bar { fill: #00f0ff; transform-origin: bottom; animation: pulse 1.4s ease-in-out infinite alternate; }
    .eq-1 { animation-delay: 0.1s; }
    .eq-2 { animation-delay: 0.5s; }
    .eq-3 { animation-delay: 0.2s; }
    .eq-4 { animation-delay: 0.6s; }
    .eq-5 { animation-delay: 0.3s; }
    
    @keyframes pulse {
      0% { transform: scaleY(0.25); }
      100% { transform: scaleY(1); }
    }
  </style>

  <!-- Container Box -->
  <rect width="598" height="118" x="1" y="1" class="bg" />

  <!-- Album Art Box (Elder Scrolls / Skyrim Dragon Icon Aesthetic) -->
  <rect x="16" y="16" width="86" height="86" rx="6" fill="#121215" stroke="#27272a" />
  <circle cx="59" cy="59" r="28" fill="#09090b" stroke="#00f0ff" stroke-width="1.5" />
  <polygon points="59,38 66,54 80,59 66,64 59,80 52,64 38,59 52,54" fill="#a855f7" />

  <!-- Track Meta -->
  <text x="118" y="40" class="title">The Streets of Whiterun</text>
  <text x="118" y="58" class="artist">Jeremy Soule — The Elder Scrolls V: Skyrim OST</text>
  <text x="118" y="74" class="album">Status: Ambient Focus Soundtrack</text>

  <!-- Progress Bar -->
  <rect x="118" y="86" width="380" height="4" class="bar-bg" />
  <rect x="118" y="86" width="210" height="4" class="bar-fill" />
  <circle cx="328" cy="88" r="4" fill="#ffffff" />
  <text x="510" y="90" class="time">2:18 / 4:05</text>

  <!-- Animated Equalizer Bars -->
  <g transform="translate(535, 35)">
    <rect class="eq-bar eq-1" x="0" y="0" width="4" height="30" rx="2" />
    <rect class="eq-bar eq-2" x="8" y="0" width="4" height="30" rx="2" />
    <rect class="eq-bar eq-3" x="16" y="0" width="4" height="30" rx="2" />
    <rect class="eq-bar eq-4" x="24" y="0" width="4" height="30" rx="2" />
    <rect class="eq-bar eq-5" x="32" y="0" width="4" height="30" rx="2" />
  </g>
</svg>
