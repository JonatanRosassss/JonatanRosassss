<svg xmlns="http://www.w3.org/2000/svg" width="800" height="130" viewBox="0 0 800 130" fill="none">
  <!-- Container Background -->
  <rect width="798" height="128" x="1" y="1" fill="#09090b" stroke="#27272a" stroke-width="1" rx="8"/>

  <!-- Left Album Icon Container -->
  <rect x="16" y="16" width="96" height="96" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
  <circle cx="64" cy="64" r="32" fill="#09090b" stroke="#00f0ff" stroke-width="1.5"/>
  
  <!-- Rotating Skyrim Star / Diamond Seal using SVG animateTransform -->
  <g transform="translate(64, 64)">
    <g>
      <polygon points="0,-22 6,-8 22,0 6,8 0,22 -6,8 -22,0 -6,-8" fill="#a855f7"/>
      <circle cx="0" cy="0" r="4" fill="#00f0ff"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Track Information -->
  <text x="130" y="40" fill="#ffffff" font-family="Courier New, monospace" font-size="15" font-weight="bold">The Streets of Whiterun</text>
  <text x="130" y="60" fill="#00f0ff" font-family="Courier New, monospace" font-size="12">Jeremy Soule — The Elder Scrolls V: Skyrim OST</text>
  <text x="130" y="78" fill="#71717a" font-family="Courier New, monospace" font-size="10">▸ Ambient Focus Soundtrack (Skyrim Atmosphere)</text>

  <!-- Timeline Bar -->
  <rect x="130" y="96" width="450" height="4" fill="#181824" rx="2"/>
  <rect x="130" y="96" width="250" height="4" fill="#00f0ff" rx="2"/>
  <circle cx="380" cy="98" r="5" fill="#ffffff" stroke="#00f0ff" stroke-width="2"/>
  <text x="590" y="100" fill="#a855f7" font-family="Courier New, monospace" font-size="10" font-weight="bold">2:18 / 4:05</text>

  <!-- Animated Native SVG Equalizer Bars -->
  <g transform="translate(660, 30)">
    <rect width="110" height="70" x="-10" y="-10" fill="#121215" stroke="#27272a" stroke-width="1" rx="6"/>
    
    <!-- Bar 1 -->
    <rect x="0" y="15" width="5" height="30" fill="#00f0ff" rx="2">
      <animate attributeName="height" values="10;35;15;40;10" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="35;10;30;5;35" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <!-- Bar 2 -->
    <rect x="9" y="20" width="5" height="25" fill="#a855f7" rx="2">
      <animate attributeName="height" values="25;8;38;12;25" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="20;37;7;33;20" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <!-- Bar 3 -->
    <rect x="18" y="10" width="5" height="35" fill="#00f0ff" rx="2">
      <animate attributeName="height" values="35;15;42;20;35" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="10;30;3;25;10" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <!-- Bar 4 -->
    <rect x="27" y="25" width="5" height="20" fill="#a855f7" rx="2">
      <animate attributeName="height" values="15;36;10;40;15" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;9;35;5;30" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <!-- Bar 5 -->
    <rect x="36" y="12" width="5" height="33" fill="#00f0ff" rx="2">
      <animate attributeName="height" values="33;18;40;12;33" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="12;27;5;33;12" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <!-- Bar 6 -->
    <rect x="45" y="18" width="5" height="27" fill="#a855f7" rx="2">
      <animate attributeName="height" values="20;42;15;30;20" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="25;3;30;15;25" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <!-- Bar 7 -->
    <rect x="54" y="8" width="5" height="37" fill="#00f0ff" rx="2">
      <animate attributeName="height" values="37;12;25;40;37" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="8;33;20;5;8" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <!-- Bar 8 -->
    <rect x="63" y="22" width="5" height="23" fill="#a855f7" rx="2">
      <animate attributeName="height" values="23;38;10;32;23" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="22;7;35;13;22" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <!-- Bar 9 -->
    <rect x="72" y="15" width="5" height="30" fill="#00f0ff" rx="2">
      <animate attributeName="height" values="10;35;20;42;10" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="35;10;25;3;35" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <!-- Bar 10 -->
    <rect x="81" y="28" width="5" height="17" fill="#a855f7" rx="2">
      <animate attributeName="height" values="17;32;8;28;17" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="28;13;37;17;28" dur="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
